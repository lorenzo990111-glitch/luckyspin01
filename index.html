<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin Gold</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 20%,#5f5000 0%,#17130a 35%,#020202 75%);
}

/* GOLD PARTICLES */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle,#fff6a0 1px,transparent 2px),
        radial-gradient(circle,#ffd700 1px,transparent 2px),
        radial-gradient(circle,#fff 1px,transparent 2px);

    background-size:
        80px 80px,
        130px 130px,
        170px 170px;

    animation:stars 8s linear infinite;
    opacity:.45;
}

@keyframes stars{
    from{
        background-position:0 0,0 0,0 0;
    }
    to{
        background-position:80px 100px,-100px 130px,120px -100px;
    }
}

.container{
    width:100%;
    max-width:550px;
    padding:25px 15px 40px;
    text-align:center;
    position:relative;
    z-index:2;
}

/* TITLE */

.title{
    font-size:42px;
    font-weight:1000;
    letter-spacing:3px;

    background:linear-gradient(
        120deg,
        #8c6500,
        #fff7a8,
        #ffd700,
        #fff,
        #b8860b,
        #ffe55c,
        #8c6500
    );

    background-size:300% auto;
    -webkit-background-clip:text;
    color:transparent;

    animation:goldMove 3s linear infinite;

    filter:drop-shadow(0 0 12px rgba(255,215,0,.55));
}

@keyframes goldMove{
    to{
        background-position:300% center;
    }
}

.subtitle{
    margin-top:5px;
    color:#ffe879;
    font-size:14px;
    letter-spacing:2px;
}

/* WHEEL AREA */

.wheel-area{
    width:min(92vw,450px);
    height:min(92vw,450px);
    margin:30px auto 25px;
    position:relative;
}

/* OUTER GOLD */

.gold-ring{
    position:absolute;
    inset:0;
    border-radius:50%;

    background:linear-gradient(
        135deg,
        #7b5600,
        #fff4a0,
        #d4af37,
        #fff,
        #9b7200,
        #ffd700
    );

    padding:10px;

    box-shadow:
        0 0 10px #ffd700,
        0 0 30px rgba(255,215,0,.7),
        0 0 70px rgba(255,215,0,.25);
}

/* WHEEL */

#wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;

    background:
        conic-gradient(
            from 0deg,
            #1976d2 0deg 72deg,
            #18a957 72deg 144deg,
            #e53935 144deg 216deg,
            #ec63b2 216deg 288deg,
            #161616 288deg 360deg
        );

    border:5px solid #111;

    transition:
        transform 5.5s cubic-bezier(.12,.75,.12,1);

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.7);
}

/* DIVIDER LINES */

.line{
    position:absolute;
    width:3px;
    height:50%;
    background:rgba(255,255,255,.75);
    left:calc(50% - 1.5px);
    top:0;
    transform-origin:bottom center;
    z-index:3;
}

.l1{transform:rotate(72deg);}
.l2{transform:rotate(144deg);}
.l3{transform:rotate(216deg);}
.l4{transform:rotate(288deg);}
.l5{transform:rotate(360deg);}

/* LABELS */

.label{
    position:absolute;
    width:50%;
    height:50%;
    left:25%;
    top:25%;

    transform-origin:50% 100%;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    z-index:4;
}

.label-content{
    margin-top:15px;
    width:130px;

    font-weight:1000;
    font-size:20px;
    line-height:1.05;

    text-shadow:
        2px 2px 3px #000,
        0 0 5px rgba(0,0,0,.7);

    transform:rotate(36deg);
}

/*
  Posisi label:
  masing-masing tepat berada di tengah segmennya
*/

.label:nth-child(1){
    transform:rotate(0deg);
}

.label:nth-child(2){
    transform:rotate(72deg);
}

.label:nth-child(3){
    transform:rotate(144deg);
}

.label:nth-child(4){
    transform:rotate(216deg);
}

.label:nth-child(5){
    transform:rotate(288deg);
}

.blue{
    color:#fff;
}

.green{
    color:#fff;
}

.red{
    color:#fff;
}

.pink{
    color:#fff;
}

.gold-text{
    color:#ffd700;
    font-size:16px;
}

/* CENTER */

.center{
    position:absolute;

    width:105px;
    height:105px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    z-index:10;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;
    font-weight:1000;
    color:#171000;

    background:
        linear-gradient(
            145deg,
            #fffbd0,
            #ffd700,
            #a87500,
            #fff2a0,
            #d4af37
        );

    border:6px solid #111;

    box-shadow:
        0 0 15px #ffd700,
        0 0 35px rgba(255,215,0,.8),
        inset 0 0 12px #fff;
}

/* POINTER */

.pointer{
    position:absolute;

    top:-20px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:55px solid #ffd700;

    z-index:20;

    filter:
        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 12px #ffd700);
}

.pointer::after{
    content:"";

    position:absolute;
    left:-11px;
    top:-52px;

    width:22px;
    height:22px;

    border-radius:50%;

    background:#fff8a0;

    box-shadow:
        0 0 10px #fff,
        0 0 20px #ffd700;
}

/* BUTTON */

.spin-button{
    width:90%;
    max-width:370px;

    padding:18px 25px;

    border:none;
    border-radius:50px;

    cursor:pointer;

    font-size:21px;
    font-weight:1000;
    letter-spacing:1px;

    color:#171000;

    background:
        linear-gradient(
            120deg,
            #8f6700,
            #fff3a0,
            #ffd700,
            #fff,
            #c18c00,
            #ffe66d
        );

    background-size:300% auto;

    animation:buttonGold 3s linear infinite;

    box-shadow:
        0 0 15px #ffd700,
        0 0 35px rgba(255,215,0,.5),
        inset 0 2px 5px #fff;
}

@keyframes buttonGold{
    to{
        background-position:300% center;
    }
}

.spin-button:hover{
    transform:scale(1.04);
}

.spin-button:disabled{
    cursor:not-allowed;
    opacity:.5;
    animation:none;
}

/* RESULT */

.result{
    display:none;

    margin:25px auto 0;
    padding:22px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #171717,
            #050505
        );

    border:2px solid #d4af37;

    box-shadow:
        0 0 25px rgba(255,215,0,.35);
}

.result-title{
    color:#ffe77b;
    font-size:16px;
    margin-bottom:10px;
}

.result-prize{
    font-size:32px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffd700,
            #b8860b
        );

    -webkit-background-clip:text;
    color:transparent;

    filter:drop-shadow(0 0 7px rgba(255,215,0,.5));
}

/* CLAIM */

.claim{
    display:none;
    margin-top:18px;
}

.claim-button{
    display:block;

    padding:17px;

    border-radius:12px;

    text-decoration:none;

    font-size:19px;
    font-weight:1000;

    color:#171000;

    background:
        linear-gradient(
            120deg,
            #a87900,
            #fff09a,
            #ffd700,
            #fff,
            #b8860b
        );

    background-size:300% auto;

    animation:goldMove 3s linear infinite;

    box-shadow:
        0 0 20px rgba(255,215,0,.65);
}

.claim-button:hover{
    transform:scale(1.02);
}

.warning{
    display:none;

    margin-top:20px;

    color:#ffd700;
    font-size:14px;
    font-weight:bold;
}

.note{
    margin-top:18px;
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">LUCKY SPIN</div>

    <div class="subtitle">
        PUTAR &nbsp; • &nbsp; MENANGKAN HADIAH
    </div>

    <div class="wheel-area">

        <!-- JARUM -->
        <div class="pointer"></div>

        <div class="gold-ring">

            <div id="wheel">

                <!-- GARIS PEMBATAS -->
                <div class="line l1"></div>
                <div class="line l2"></div>
                <div class="line l3"></div>
                <div class="line l4"></div>
                <div class="line l5"></div>

                <!-- HADIAH -->

                <div class="label">
                    <div class="label-content blue">
                        💎<br>
                        50 RB
                    </div>
                </div>

                <div class="label">
                    <div class="label-content green">
                        💚<br>
                        100 RB
                    </div>
                </div>

                <div class="label">
                    <div class="label-content red">
                        🔥<br>
                        150 RB
                    </div>
                </div>

                <div class="label">
                    <div class="label-content pink">
                        💗<br>
                        200 RB
                    </div>
                </div>

                <div class="label">
                    <div class="label-content gold-text">
                        ⭐<br>
                        BONUS<br>
                        CASHBACK<br>
                        1 JT
                    </div>
                </div>

                <!-- TENGAH -->
                <div class="center">
                    SPIN
                </div>

            </div>

        </div>

    </div>

    <!-- TOMBOL SPIN -->

    <button
        class="spin-button"
        id="spinButton"
        onclick="spinWheel()"
    >
        🎰 SPIN SEKARANG
    </button>

    <!-- HASIL -->

    <div class="result" id="result">

        <div class="result-title">
            🎉 SELAMAT! ANDA MENDAPATKAN
        </div>

        <div
            class="result-prize"
            id="resultPrize"
        >
            -
        </div>

        <div class="claim" id="claim">

            <a
                class="claim-button"
                href="https://wadah4d01.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                🎁 CLAIM HADIAH
            </a>

        </div>

    </div>

    <div class="warning" id="warning">
        ⚠️ Kesempatan spin Anda sudah digunakan.
    </div>

    <div class="note">
        Setiap pengguna hanya mendapatkan 1x kesempatan spin.
    </div>

</div>


<script>

/*
=================================================
DATA HADIAH
=================================================
*/

const prizes = [
    "50 RB",
    "100 RB",
    "150 RB",
    "200 RB",
    "BONUS CASHBACK 1 JT"
];


/*
=================================================
ELEMEN
=================================================
*/

const wheel = document.getElementById("wheel");
const spinButton = document.getElementById("spinButton");
const result = document.getElementById("result");
const resultPrize = document.getElementById("resultPrize");
const claim = document.getElementById("claim");
const warning = document.getElementById("warning");

let spinning = false;


/*
=================================================
SPIN
=================================================

Ada 5 bagian.

Masing-masing bagian = 72 derajat.

Posisi tengah:
50 RB       = 36°
100 RB      = 108°
150 RB      = 180°
200 RB      = 252°
BONUS 1 JT  = 324°

Jarum berada di bagian ATAS = -90°.

Rumus rotasi dibuat supaya
TENGAH HADIAH yang menang tepat
berada di bawah jarum.
=================================================
*/

function spinWheel(){

    if(spinning){
        return;
    }

    /*
    Cek apakah sudah pernah spin
    */

    if(localStorage.getItem("luckySpinUsed") === "true"){

        warning.style.display = "block";

        spinButton.disabled = true;

        return;
    }


    spinning = true;

    spinButton.disabled = true;


    /*
    Tentukan pemenang secara random
    */

    const winner =
        Math.floor(Math.random() * prizes.length);


    /*
    72 derajat per hadiah
    */

    const segmentAngle = 72;


    /*
    Posisi tengah segmen
    */

    const segmentCenter =
        winner * segmentAngle + 36;


    /*
    Jarum = -90 derajat

    Cari rotasi supaya pusat hadiah
    tepat berada di posisi jarum.
    */

    const targetRotation =
        360 * 7 +
        (-90 - segmentCenter);


    /*
    Jalankan roda
    */

    wheel.style.transform =
        `rotate(${targetRotation}deg)`;


    /*
    Tunggu animasi selesai
    */

    setTimeout(function(){

        /*
        Tampilkan hasil yang SAMA
        dengan hadiah yang ditunjuk jarum
        */

        resultPrize.textContent =
            prizes[winner];


        result.style.display =
            "block";


        claim.style.display =
            "block";


        /*
        Tandai sudah digunakan
        */

        localStorage.setItem(
            "luckySpinUsed",
            "true"
        );


        spinButton.textContent =
            "✓ SPIN SUDAH DIGUNAKAN";


        spinning = false;


        /*
        Scroll sedikit ke hasil
        */

        result.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });


    },5600);

}


/*
=================================================
CEK SAAT HALAMAN DIBUKA
=================================================
*/

window.addEventListener("load",function(){

    if(
        localStorage.getItem("luckySpinUsed")
        === "true"
    ){

        spinButton.disabled = true;

        spinButton.textContent =
            "✓ SPIN SUDAH DIGUNAKAN";

        warning.style.display =
            "block";
    }

});

</script>

</body>
</html>
