<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin Gold</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 50% 0%,
            #4b3a09 0%,
            #181408 32%,
            #050505 72%
        );
    color:white;
    overflow-x:hidden;
}

/* =========================================
   GOLD LIGHT
========================================= */

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    pointer-events:none;

    background:
        linear-gradient(
            115deg,
            transparent 42%,
            rgba(255,215,0,.08) 48%,
            rgba(255,255,255,.14) 50%,
            rgba(255,215,0,.08) 52%,
            transparent 58%
        );

    animation:goldLight 7s linear infinite;
}

@keyframes goldLight{
    from{
        transform:translateX(-35%) rotate(8deg);
    }
    to{
        transform:translateX(35%) rotate(8deg);
    }
}

.page{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:30px 15px 50px;
    text-align:center;
}

/* =========================================
   HEADER
========================================= */

.brand{
    font-size:43px;
    font-weight:900;
    letter-spacing:4px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff4a0 20%,
            #ffd700 48%,
            #9b7208 65%,
            #fff1a0 85%,
            #ffd700
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 0 10px rgba(255,215,0,.4));
}

.subtitle{
    margin-top:6px;
    margin-bottom:28px;

    font-size:13px;
    letter-spacing:3px;
    color:#d8bd59;
}

/* =========================================
   WHEEL WRAPPER
========================================= */

.wheel-wrapper{
    position:relative;

    width:min(92vw,470px);
    aspect-ratio:1/1;

    margin:0 auto;
}

/* =========================================
   POINTER
========================================= */

.pointer{
    position:absolute;

    top:-3px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    width:0;
    height:0;

    border-left:23px solid transparent;
    border-right:23px solid transparent;
    border-top:52px solid #ffd700;

    filter:
        drop-shadow(0 0 3px white)
        drop-shadow(0 0 10px #ffd700);
}

.pointer-dot{
    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:white;

    left:50%;
    top:38px;

    transform:translateX(-50%);

    z-index:51;

    box-shadow:
        0 0 7px white,
        0 0 16px #ffd700;
}

/* =========================================
   WHEEL OUTER GOLD
========================================= */

.wheel-frame{
    position:absolute;

    inset:7px;

    border-radius:50%;

    padding:10px;

    background:
        linear-gradient(
            135deg,
            #fff4a0,
            #c39212,
            #fff8bd,
            #8d6505,
            #ffd700,
            #9b7108,
            #fff2a0
        );

    box-shadow:
        0 0 15px rgba(255,215,0,.7),
        0 0 45px rgba(255,215,0,.25);
}

/* =========================================
   WHEEL
========================================= */

.wheel{
    position:relative;

    width:100%;
    height:100%;

    border-radius:50%;

    overflow:hidden;

    background:
        conic-gradient(
            from -90deg,
            #1674d1 0deg 72deg,
            #159c4b 72deg 144deg,
            #dc2e2e 144deg 216deg,
            #df5da5 216deg 288deg,
            #151515 288deg 360deg
        );

    border:4px solid #171717;

    transition:
        transform 6s cubic-bezier(.12,.72,.08,1);
}

/* =========================================
   SECTOR LINES
========================================= */

.divider{
    position:absolute;

    width:2px;
    height:50%;

    left:50%;
    top:0;

    transform-origin:bottom center;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffd700 40%,
            #7b5900
        );

    z-index:5;

    box-shadow:0 0 5px rgba(255,215,0,.8);
}

.d1{transform:rotate(72deg)}
.d2{transform:rotate(144deg)}
.d3{transform:rotate(216deg)}
.d4{transform:rotate(288deg)}

/* =========================================
   PRIZE BOX
========================================= */

.prize{
    position:absolute;

    left:50%;
    top:50%;

    width:112px;

    margin-left:-56px;
    margin-top:-30px;

    text-align:center;

    z-index:10;

    font-weight:900;

    color:#fff;

    text-shadow:
        2px 2px 4px rgba(0,0,0,.9);
}

/*
   Setiap hadiah memiliki satu posisi
   yang sama persis di tengah sektornya.
*/

.prize1{
    transform:
        rotate(-54deg)
        translateY(-143px)
        rotate(54deg);
}

.prize2{
    transform:
        rotate(18deg)
        translateY(-143px)
        rotate(-18deg);
}

.prize3{
    transform:
        rotate(90deg)
        translateY(-143px)
        rotate(-90deg);
}

.prize4{
    transform:
        rotate(162deg)
        translateY(-143px)
        rotate(-162deg);
}

.prize5{
    transform:
        rotate(234deg)
        translateY(-143px)
        rotate(-234deg);
}

.amount{
    display:block;

    font-size:20px;
    line-height:1.15;
}

.bonus{
    display:block;

    font-size:14px;
    line-height:1.2;

    color:#ffd700;
}

/* =========================================
   CENTER
========================================= */

.center{
    position:absolute;

    width:96px;
    height:96px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:30;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ffe87b 18%,
            #ffd700 42%,
            #9b7100 75%,
            #211900
        );

    border:6px solid #111;

    color:#171000;

    font-size:17px;
    font-weight:1000;

    box-shadow:
        0 0 18px #ffd700,
        inset 0 0 12px white;
}

/* =========================================
   SPIN BUTTON
========================================= */

.spin-button{
    display:block;

    width:90%;
    max-width:390px;

    margin:32px auto 0;

    padding:17px 20px;

    border:none;
    border-radius:50px;

    cursor:pointer;

    font-size:19px;
    font-weight:900;
    letter-spacing:1px;

    color:#181200;

    background:
        linear-gradient(
            180deg,
            #fffbd1 0%,
            #ffe45c 20%,
            #d6a900 48%,
            #ffd700 70%,
            #fff1a0 100%
        );

    border:2px solid #fff3a1;

    box-shadow:
        0 5px 18px rgba(0,0,0,.45),
        0 0 20px rgba(255,215,0,.4),
        inset 0 2px 5px white;

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.5),
        0 0 30px rgba(255,215,0,.7),
        inset 0 2px 5px white;
}

.spin-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

/* =========================================
   RESULT
========================================= */

.result{
    display:none;

    width:100%;

    margin:25px auto 0;

    padding:22px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #292108,
            #101010
        );

    border:1px solid #d5ad25;

    box-shadow:
        0 0 25px rgba(255,215,0,.2);

    animation:result .5s ease;
}

@keyframes result{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.result-label{
    color:#d8bd59;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:7px;
}

.result-value{
    font-size:31px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffd700,
            #a87905
        );

    -webkit-background-clip:text;
    color:transparent;
}

/* =========================================
   CLAIM
========================================= */

.claim-title{
    margin-top:18px;
    margin-bottom:9px;

    font-size:13px;
    color:#aaa;
}

.claim-button{
    display:block;

    width:100%;

    padding:15px;

    border-radius:11px;

    text-decoration:none;

    color:#171000;

    font-size:18px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #fff8a8,
            #ffd700,
            #b8860b,
            #ffd700
        );

    border:1px solid #fff0a0;

    box-shadow:
        0 0 18px rgba(255,215,0,.45),
        inset 0 2px 4px white;

    transition:.2s;
}

.claim-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 28px rgba(255,215,0,.7),
        inset 0 2px 4px white;
}

/* =========================================
   USED MESSAGE
========================================= */

.used{
    display:none;

    margin-top:17px;

    color:#e8cc5c;

    font-size:13px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:450px){

    .page{
        padding-top:22px;
    }

    .brand{
        font-size:34px;
    }

    .subtitle{
        font-size:10px;
        letter-spacing:2px;
    }

    .wheel-wrapper{
        width:94vw;
    }

    .prize{
        width:90px;
        margin-left:-45px;
    }

    .amount{
        font-size:16px;
    }

    .bonus{
        font-size:11px;
    }

    .prize1,
    .prize2,
    .prize3,
    .prize4,
    .prize5{
        transform:
            rotate(var(--angle))
            translateY(-127px)
            rotate(calc(var(--angle) * -1));
    }

    .prize1{--angle:-54deg}
    .prize2{--angle:18deg}
    .prize3{--angle:90deg}
    .prize4{--angle:162deg}
    .prize5{--angle:234deg}

    .center{
        width:78px;
        height:78px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="brand">
        LUCKY SPIN
    </div>

    <div class="subtitle">
        ✦ PUTAR SEKALI • MENANGKAN HADIAH ✦
    </div>


    <!-- =====================================
         WHEEL
    ====================================== -->

    <div class="wheel-wrapper">

        <!-- JARUM -->

        <div class="pointer"></div>
        <div class="pointer-dot"></div>


        <div class="wheel-frame">

            <div
                class="wheel"
                id="wheel">


                <!-- GARIS SEKTOR -->

                <div class="divider d1"></div>
                <div class="divider d2"></div>
                <div class="divider d3"></div>
                <div class="divider d4"></div>


                <!-- 50 RB -->

                <div class="prize prize1">

                    <span class="amount">
                        50 RB
                    </span>

                </div>


                <!-- 100 RB -->

                <div class="prize prize2">

                    <span class="amount">
                        100 RB
                    </span>

                </div>


                <!-- 150 RB -->

                <div class="prize prize3">

                    <span class="amount">
                        150 RB
                    </span>

                </div>


                <!-- 200 RB -->

                <div class="prize prize4">

                    <span class="amount">
                        200 RB
                    </span>

                </div>


                <!-- BONUS -->

                <div class="prize prize5">

                    <span class="bonus">
                        BONUS<br>
                        CASHBACK<br>
                        1 JT
                    </span>

                </div>


                <!-- CENTER -->

                <div class="center">
                    SPIN
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================
         SPIN BUTTON
    ====================================== -->

    <button
        class="spin-button"
        id="spinButton"
        onclick="spin()">

        🎰 SPIN SEKARANG

    </button>


    <!-- =====================================
         RESULT
    ====================================== -->

    <div
        class="result"
        id="result">

        <div class="result-label">
            HADIAH YANG ANDA DAPATKAN
        </div>

        <div
            class="result-value"
            id="resultValue">
        </div>


        <div class="claim-title">
            Silakan klik tombol di bawah untuk claim hadiah
        </div>


        <a
            href="https://wadah4d01.com"
            target="_blank"
            rel="noopener noreferrer"
            class="claim-button">

            🎁 CLAIM HADIAH

        </a>

    </div>


    <div
        class="used"
        id="used">

        ⚠️ Kesempatan spin Anda sudah digunakan.

    </div>

</div>


<script>

/* =========================================
   DATA HADIAH
========================================= */

const hadiah = [
    "50 RB",
    "100 RB",
    "150 RB",
    "200 RB",
    "BONUS CASHBACK 1 JT"
];

const wheel =
    document.getElementById("wheel");

const spinButton =
    document.getElementById("spinButton");

const result =
    document.getElementById("result");

const resultValue =
    document.getElementById("resultValue");

const used =
    document.getElementById("used");

let sedangSpin = false;


/* =========================================
   CEK STATUS SPIN
========================================= */

function checkSpin(){

    if(
        localStorage.getItem("lucky_spin_done")
        === "yes"
    ){

        spinButton.disabled = true;

        spinButton.innerHTML =
            "✓ SPIN SUDAH DIGUNAKAN";

        used.style.display =
            "block";
    }
}

checkSpin();


/* =========================================
   SPIN
========================================= */

function spin(){

    if(sedangSpin){
        return;
    }


    if(
        localStorage.getItem("lucky_spin_done")
        === "yes"
    ){
        return;
    }


    sedangSpin = true;

    spinButton.disabled = true;


    /*
    RANDOM HADIAH

    0 = 50 RB
    1 = 100 RB
    2 = 150 RB
    3 = 200 RB
    4 = BONUS
    */

    const winner =
        Math.floor(
            Math.random() * hadiah.length
        );


    /*
    ======================================
    PERHITUNGAN POSISI JARUM
    ======================================

    5 hadiah = 360°

    360 / 5 = 72°

    Titik tengah masing-masing sektor:

    50 RB  = 36°
    100 RB = 108°
    150 RB = 180°
    200 RB = 252°
    BONUS  = 324°

    Karena roda menggunakan
    conic-gradient dari -90°,
    kita putar roda sebesar:

    6 putaran penuh
    dikurangi posisi tengah sektor.

    Dengan begitu titik tengah hadiah
    berhenti tepat di bawah jarum.
    */

    const sector = 72;

    const center =
        winner * sector + 36;

    const fullTurns =
        360 * 6;

    const rotation =
        fullTurns - center;


    /*
    MULAI PUTAR
    */

    wheel.style.transform =
        "rotate(" +
        rotation +
        "deg)";


    /*
    SELESAI ANIMASI
    */

    setTimeout(function(){

        /*
        HASIL HARUS SAMA DENGAN
        SEKTOR YANG DITUNJUK
        */

        resultValue.textContent =
            hadiah[winner];


        result.style.display =
            "block";


        /*
        SIMPAN STATUS
        */

        localStorage.setItem(
            "lucky_spin_done",
            "yes"
        );


        spinButton.innerHTML =
            "✓ SPIN SUDAH DIGUNAKAN";


        sedangSpin = false;


        /*
        SCROLL KE HASIL
        */

        setTimeout(function(){

            result.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        },200);

    },6200);

}

</script>

</body>
</html>
```
