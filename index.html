<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin Gold</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 0%,#705b12 0%,#17130a 30%,#050505 70%);
  overflow-x:hidden;
}

/* GOLD PARTICLES */
body:before,
body:after{
  content:"✦  ✧  ✦  ✧  ✦  ✧  ✦";
  position:fixed;
  color:#ffd700;
  font-size:28px;
  letter-spacing:45px;
  opacity:.15;
  animation:goldFloat 6s linear infinite;
  pointer-events:none;
}

body:before{
  top:10%;
  left:-50px;
}

body:after{
  bottom:10%;
  right:-100px;
  animation-delay:2s;
}

@keyframes goldFloat{
  0%{transform:translateY(0) rotate(0deg);opacity:.1}
  50%{opacity:.35}
  100%{transform:translateY(-80px) rotate(15deg);opacity:.1}
}

.container{
  width:100%;
  max-width:600px;
  padding:25px 15px 45px;
  text-align:center;
}

/* HEADER */
.logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:3px;
  margin-bottom:4px;

  background:linear-gradient(
    180deg,
    #fffbd0,
    #fff,
    #ffd700,
    #b8860b,
    #fff0a0,
    #ffd700
  );

  -webkit-background-clip:text;
  color:transparent;

  text-shadow:0 0 20px rgba(255,215,0,.45);
}

.subtitle{
  color:#ffe98a;
  font-size:14px;
  letter-spacing:2px;
  margin-bottom:25px;
}

/* WHEEL AREA */
.wheel-area{
  position:relative;
  width:min(94vw,470px);
  height:min(94vw,470px);
  margin:auto;
}

/* POINTER */
.pointer{
  position:absolute;
  z-index:20;
  top:-4px;
  left:50%;
  transform:translateX(-50%);

  width:0;
  height:0;

  border-left:25px solid transparent;
  border-right:25px solid transparent;
  border-top:55px solid #ffd700;

  filter:
    drop-shadow(0 0 4px #fff)
    drop-shadow(0 0 12px #ffd700);
}

/* POINTER INNER */
.pointer:after{
  content:"";
  position:absolute;
  left:-10px;
  top:-48px;

  width:20px;
  height:20px;
  border-radius:50%;

  background:#fff;
  box-shadow:0 0 15px #ffd700;
}

/* WHEEL */
.wheel{
  position:absolute;
  inset:10px;

  border-radius:50%;

  border:12px solid #d4af37;

  box-shadow:
    0 0 0 5px #151515,
    0 0 25px #ffd700,
    0 0 60px rgba(255,215,0,.35),
    inset 0 0 25px #000;

  overflow:hidden;

  transition:
    transform 6s cubic-bezier(.12,.72,.08,1);
}

/* SVG */
.wheel svg{
  width:100%;
  height:100%;
  display:block;
}

/* TEXT */
.prize-text{
  font-weight:1000;
  font-size:19px;
  fill:white;
  stroke:#000;
  stroke-width:3px;
  paint-order:stroke;
}

.prize-text.big{
  font-size:17px;
}

/* CENTER */
.center{
  position:absolute;
  z-index:10;

  width:105px;
  height:105px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 25%,
      #fff,
      #ffe56b 18%,
      #ffd700 40%,
      #9b7100 75%,
      #332500
    );

  border:7px solid #111;

  box-shadow:
    0 0 20px #ffd700,
    inset 0 0 15px #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#171000;
  font-size:18px;
  font-weight:1000;
  text-shadow:0 1px 1px #fff;
}

/* SPIN BUTTON */
.spin-btn{
  margin-top:30px;

  width:90%;
  max-width:380px;

  border:2px solid #fff2a8;
  border-radius:50px;

  padding:18px 20px;

  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;

  color:#181200;

  cursor:pointer;

  background:
    linear-gradient(
      180deg,
      #fff9a8 0%,
      #ffd700 28%,
      #b8860b 52%,
      #ffd700 75%,
      #fff4a0 100%
    );

  box-shadow:
    0 0 20px rgba(255,215,0,.6),
    inset 0 2px 5px white;

  transition:.2s;
}

.spin-btn:hover{
  transform:scale(1.04);
  box-shadow:
    0 0 30px rgba(255,215,0,.9),
    inset 0 2px 5px white;
}

.spin-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* RESULT */
.result{
  display:none;
  margin:25px auto 0;

  padding:23px 18px;

  border-radius:20px;

  border:2px solid #ffd700;

  background:
    linear-gradient(
      145deg,
      rgba(70,55,10,.95),
      rgba(10,10,10,.98)
    );

  box-shadow:
    0 0 25px rgba(255,215,0,.3),
    inset 0 0 20px rgba(255,215,0,.08);

  animation:resultIn .6s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:scale(.8);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.result-title{
  color:#ffe66d;
  font-size:15px;
  letter-spacing:1px;
  margin-bottom:8px;
}

.result-prize{
  font-size:32px;
  font-weight:1000;

  background:
    linear-gradient(
      180deg,
      #fff,
      #ffd700,
      #b8860b,
      #fff0a0
    );

  -webkit-background-clip:text;
  color:transparent;

  text-shadow:0 0 15px rgba(255,215,0,.3);
}

/* CLAIM */
.claim{
  margin-top:18px;
}

.claim-btn{
  display:block;

  text-decoration:none;

  width:100%;

  padding:16px;

  border-radius:12px;

  color:#151000;

  font-size:19px;
  font-weight:1000;

  background:
    linear-gradient(
      180deg,
      #fff8a0,
      #ffd700,
      #b8860b,
      #ffd700
    );

  border:1px solid #fff3a0;

  box-shadow:
    0 0 20px rgba(255,215,0,.55),
    inset 0 2px 4px #fff;

  transition:.2s;
}

.claim-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 30px rgba(255,215,0,.9),
    inset 0 2px 4px #fff;
}

/* ALREADY */
.already{
  display:none;

  margin-top:18px;

  padding:12px;

  border-radius:10px;

  background:#151515;
  border:1px solid #806b18;

  color:#ffd700;

  font-size:13px;
}

/* FOOTER */
.footer{
  margin-top:20px;
  color:#8d8d8d;
  font-size:11px;
}

/* MOBILE */
@media(max-width:430px){

  .logo{
    font-size:34px;
  }

  .wheel-area{
    width:94vw;
    height:94vw;
  }

  .prize-text{
    font-size:15px;
  }

  .prize-text.big{
    font-size:13px;
  }

  .center{
    width:82px;
    height:82px;
    font-size:14px;
  }

  .spin-btn{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">LUCKY SPIN</div>

  <div class="subtitle">
    ✦ PUTAR RODA &nbsp; • &nbsp; DAPATKAN HADIAH ✦
  </div>

  <div class="wheel-area">

    <!-- JARUM -->
    <div class="pointer"></div>

    <!-- RODA -->
    <div class="wheel" id="wheel">

      <svg viewBox="0 0 400 400">

        <!--
        5 sektor:
        0-72   = 50 RB
        72-144 = 100 RB
        144-216 = 150 RB
        216-288 = 200 RB
        288-360 = BONUS
        -->

        <!-- 50 RB -->
        <path
          d="M200 200 L200 15
             A185 185 0 0 1 376 257 Z"
          fill="#1769d1"
          stroke="#ffd700"
          stroke-width="2"
        />

        <!-- 100 RB -->
        <path
          d="M200 200 L376 257
             A185 185 0 0 1 309 350 Z"
          fill="#159447"
          stroke="#ffd700"
          stroke-width="2"
        />

        <!-- 150 RB -->
        <path
          d="M200 200 L309 350
             A185 185 0 0 1 91 350 Z"
          fill="#d92828"
          stroke="#ffd700"
          stroke-width="2"
        />

        <!-- 200 RB -->
        <path
          d="M200 200 L91 350
             A185 185 0 0 1 24 257 Z"
          fill="#e65caa"
          stroke="#ffd700"
          stroke-width="2"
        />

        <!-- BONUS -->
        <path
          d="M200 200 L24 257
             A185 185 0 0 1 200 15 Z"
          fill="#171717"
          stroke="#ffd700"
          stroke-width="2"
        />

        <!-- TEXT 50 -->
        <text
          x="290"
          y="118"
          text-anchor="middle"
          class="prize-text"
          transform="rotate(36 290 118)">
          50 RB
        </text>

        <!-- TEXT 100 -->
        <text
          x="292"
          y="285"
          text-anchor="middle"
          class="prize-text"
          transform="rotate(108 292 285)">
          100 RB
        </text>

        <!-- TEXT 150 -->
        <text
          x="110"
          y="285"
          text-anchor="middle"
          class="prize-text"
          transform="rotate(180 110 285)">
          150 RB
        </text>

        <!-- TEXT 200 -->
        <text
          x="108"
          y="118"
          text-anchor="middle"
          class="prize-text"
          transform="rotate(252 108 118)">
          200 RB
        </text>

        <!-- BONUS -->
        <text
          x="200"
          y="105"
          text-anchor="middle"
          class="prize-text big">
          BONUS
        </text>

        <text
          x="200"
          y="130"
          text-anchor="middle"
          class="prize-text big">
          CASHBACK
        </text>

        <text
          x="200"
          y="155"
          text-anchor="middle"
          class="prize-text big">
          1 JT
        </text>

      </svg>

      <div class="center">
        SPIN
      </div>

    </div>
  </div>

  <!-- BUTTON -->
  <button
    class="spin-btn"
    id="spinBtn"
    onclick="spinWheel()">
    🎰 SPIN SEKARANG
  </button>

  <!-- RESULT -->
  <div
    class="result"
    id="result">

    <div class="result-title">
      🎉 SELAMAT! HADIAH ANDA
    </div>

    <div
      class="result-prize"
      id="resultPrize">
      -
    </div>

    <!-- CLAIM -->
    <div
      class="claim"
      id="claim">

      <a
        href="https://wadah4d01.com"
        target="_blank"
        rel="noopener noreferrer"
        class="claim-btn">
        🎁 CLAIM HADIAH
      </a>

    </div>
  </div>

  <div
    class="already"
    id="already">
    ⚠️ Kesempatan spin sudah digunakan.
  </div>

  <div class="footer">
    Setiap browser mendapatkan 1 kesempatan spin.
  </div>

</div>


<script>

/*
==================================================
LUCKY SPIN
==================================================

Urutan sektor dari sisi atas / jarum:

0 = 50 RB
1 = 100 RB
2 = 150 RB
3 = 200 RB
4 = BONUS CASHBACK 1 JT

Setiap sektor = 72 derajat.

Kita mengarahkan TENGAH sektor tepat ke jarum.
==================================================
*/

const prizes = [
  "50 RB",
  "100 RB",
  "150 RB",
  "200 RB",
  "BONUS CASHBACK 1 JT"
];

const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");
const result = document.getElementById("result");
const resultPrize = document.getElementById("resultPrize");
const already = document.getElementById("already");

let spinning = false;


/* ==============================================
   CEK APAKAH SUDAH SPIN
============================================== */

window.addEventListener("load", function(){

  if(localStorage.getItem("luckySpinUsed") === "true"){

    spinBtn.disabled = true;
    spinBtn.innerHTML = "✓ SPIN SUDAH DIGUNAKAN";

    already.style.display = "block";
  }

});


/* ==============================================
   FUNGSI SPIN
============================================== */

function spinWheel(){

  if(spinning){
    return;
  }

  /* Cegah spin kedua */
  if(localStorage.getItem("luckySpinUsed") === "true"){

    spinBtn.disabled = true;
    already.style.display = "block";

    return;
  }

  spinning = true;
  spinBtn.disabled = true;

  /*
  Pilih pemenang secara random.
  */

  const winner =
    Math.floor(Math.random() * prizes.length);

  /*
  ===============================================
  BAGIAN PALING PENTING
  ===============================================

  Setiap sektor memiliki lebar 72°.

  Kita arahkan TENGAH sektor pemenang
  tepat ke posisi jarum di atas.

  Formula:

  winner * 72 + 36

  adalah posisi tengah sektor.

  Kemudian roda diputar berlawanan arah
  sehingga titik tersebut berhenti di atas.
  */

  const sector = 72;

  const centerOfSector =
    winner * sector + sector / 2;

  /*
  Tambahkan 6 putaran penuh agar animasi
  terlihat panjang dan bagus.
  */

  const fullTurns = 6 * 360;

  /*
  Karena jarum berada di 0° / atas,
  roda harus berhenti dengan pusat sektor
  pemenang di posisi 0°.
  */

  const finalRotation =
    fullTurns + (360 - centerOfSector);

  /*
  Terapkan rotasi.
  */

  wheel.style.transform =
    "rotate(" + finalRotation + "deg)";


  /*
  Tunggu animasi selesai.
  */

  setTimeout(function(){

    /*
    Tampilkan hasil yang SAMA dengan sektor
    yang berhenti di bawah jarum.
    */

    resultPrize.textContent =
      prizes[winner];

    result.style.display =
      "block";


    /*
    Simpan status spin.
    */

    localStorage.setItem(
      "luckySpinUsed",
      "true"
    );


    /*
    Kunci tombol.
    */

    spinBtn.innerHTML =
      "✓ SPIN SUDAH DIGUNAKAN";

    spinning = false;


    /*
    Scroll sedikit ke hasil.
    */

    setTimeout(function(){

      result.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },200);

  },6200);

}

</script>

</body>
</html>
